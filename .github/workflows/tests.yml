name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    name: Native and QML unit tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        # No submodules needed for the native helpers and QML tests.

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev \
            qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qt-labs-folderlistmodel cmake ninja-build

      - name: Configure (standalone test build)
        # Build the tests/ directory directly — avoids the KDE/Plasma/mpv/Vulkan
        # dependencies that the full plugin requires.
        run: |
          cmake -B build/tests -S tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -G Ninja

      - name: Build
        run: cmake --build build/tests

      - name: Run tests
        run: |
          ctest --test-dir build/tests --output-on-failure -V
          ctest --test-dir build/tests -R qml_tests --no-tests=error --output-on-failure
